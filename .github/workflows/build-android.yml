name: Build Investify Android APK

on:
  workflow_dispatch:
    inputs:
      backend_api_url:
        description: 'Backend API URL (e.g. https://your-backend.run.app or https://api.yourdomain.com)'
        required: true
        type: string
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Configure Backend API Environment
        run: |
          API_URL="${{ inputs.backend_api_url || secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL || '' }}"
          # Strip trailing slashes
          API_URL=$(echo "$API_URL" | sed 's:/*$::')
          echo "=================================================="
          echo "Baking Backend API URL into APK: $API_URL"
          echo "=================================================="
          echo "VITE_API_BASE_URL=$API_URL" > .env.production
          echo "VITE_API_URL=$API_URL" >> .env.production
          echo "VITE_API_BASE_URL=$API_URL" >> .env
          echo "VITE_API_URL=$API_URL" >> .env

      - name: Build Web Client Assets
        env:
          VITE_API_BASE_URL: ${{ inputs.backend_api_url || secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL || '' }}
          VITE_API_URL: ${{ inputs.backend_api_url || secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL || '' }}
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generation
        run: |
          ls -la android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk ./investify-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Investify-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
