name: Build Investify Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Hosted Backend API Base URL (e.g. https://your-domain.run.app)'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Web Client Assets
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || secrets.VITE_API_BASE_URL || 'https://ais-dev-wprzecnjv6ps2nlop6pkwv-1020468351467.asia-southeast1.run.app' }}
          VITE_API_URL: ${{ inputs.api_base_url || secrets.VITE_API_BASE_URL || 'https://ais-dev-wprzecnjv6ps2nlop6pkwv-1020468351467.asia-southeast1.run.app' }}
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generation
        run: |
          ls -la android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk ./investify-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Investify-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
