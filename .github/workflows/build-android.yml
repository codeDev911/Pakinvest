name: Build Investify Android APK

on:
  workflow_dispatch:
    inputs:
      backend_api_url:
        description: 'Backend API URL (e.g. https://your-backend.run.app or https://api.yourdomain.com)'
        required: true
        type: string
      app_version:
        description: 'App Version (e.g. 1.2, 1.2.3, 1.3 - matched against public Investify-vX.X.apk)'
        required: false
        default: '1.2'
        type: string

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Backend API URL
        run: |
          RAW_URL="${{ inputs.backend_api_url }}"
          if [ -z "$RAW_URL" ]; then
            echo "::error::Backend API URL input is empty! You must specify your backend URL when triggering the workflow."
            exit 1
          fi
          echo "Specified Backend API URL: $RAW_URL"

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          # Add SDK commandline tools and platform tools to PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses & Install Components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" || true

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Configure Backend API Environment
        run: |
          API_URL="${{ inputs.backend_api_url }}"
          # Trim leading/trailing whitespace
          API_URL=$(echo "$API_URL" | xargs)
          # Strip trailing slashes
          API_URL=$(echo "$API_URL" | sed 's:/*$::')
          # Ensure protocol exists
          if [[ ! "$API_URL" =~ ^https?:// ]]; then
            API_URL="https://$API_URL"
          fi
          # Strip duplicate /api if entered
          API_URL=$(echo "$API_URL" | sed 's:/api$::')

          APP_VER="${{ inputs.app_version }}"
          if [ -z "$APP_VER" ]; then
            APP_VER="1.2"
          fi
          APP_VER=$(echo "$APP_VER" | sed 's/^[vV]//' | xargs)

          echo "=================================================="
          echo "Baking Backend API URL into APK: $API_URL"
          echo "Baking App Version into APK:     $APP_VER"
          echo "=================================================="
          echo "VITE_API_BASE_URL=$API_URL" > .env.production
          echo "VITE_API_URL=$API_URL" >> .env.production
          echo "VITE_APP_VERSION=$APP_VER" >> .env.production
          echo "VITE_API_BASE_URL=$API_URL" >> .env
          echo "VITE_API_URL=$API_URL" >> .env
          echo "VITE_APP_VERSION=$APP_VER" >> .env

      - name: Build Web Client Assets
        run: |
          npm run build
          # Exclude server bundle and any existing APK binaries from web assets so they are NOT packaged inside the Android APK
          rm -f dist/*.apk dist/server.cjs*

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android
          # Ensure no APK binaries or server bundles are inside android assets
          rm -f android/app/src/main/assets/public/*.apk android/app/src/main/assets/public/server.cjs*

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug -PversionName="${{ inputs.app_version || '1.2' }}" --no-daemon --stacktrace

      - name: Verify APK Generation
        run: |
          ls -la android/app/build/outputs/apk/debug/
          APP_VER="${{ inputs.app_version || '1.2' }}"
          APP_VER=$(echo "$APP_VER" | sed 's/^[vV]//' | xargs)
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Investify-v${APP_VER}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./investify.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Investify-v${{ inputs.app_version || '1.2' }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
